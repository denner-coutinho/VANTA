# Produção (um servidor): docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# Só o nginx (porta 8080) fica exposto; banco, Redis, API e jogo ficam na rede interna.
# Para testar localmente com e-mail falso: acrescente --profile local (sobe o mailpit em :8025).
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://vanta:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/vanta?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?defina MFA_ENCRYPTION_KEY}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?defina PUBLIC_APP_URL}
  # Instalação local de teste: o launcher acrescenta o endereço da rede local (http://192.168.x.x:porta).
  CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_APP_URL}}
  REFRESH_COOKIE_PATH: /api/auth
  # Só o nginx na frente. Com outro balanceador antes dele, use 2.
  TRUST_PROXY: ${TRUST_PROXY:-1}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: "${MAIL_FROM:-VANTA: FRONTLINE <no-reply@vanta.gg>}"
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
  # Só a instalação local de teste liga: a Temporada 1 nasce ativa no seed.
  SEED_ACTIVATE_SEASON: ${SEED_ACTIVATE_SEASON:-false}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vanta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vanta
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vanta"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"], interval: 5s, retries: 20 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }

  migrate:
    build: { context: ., target: migrate }
    image: vanta-frontline/migrate:${VANTA_VERSION:-local}
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: ., target: server }
    image: vanta-frontline/server:${VANTA_VERSION:-local}
    restart: unless-stopped
    init: true
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, retries: 6, start_period: 20s }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Servidor de jogo. Cada processo é um "nó" (GAME_NODE_ID); partidas, grupos e salas vivem num nó e o
  # Redis coordena os nós. Mais capacidade: suba também o game2 (--profile scale); veja docs/DEPLOY.md.
  game:
    image: vanta-frontline/server:${VANTA_VERSION:-local}
    command: ["node", "dist/game-main.js"]
    restart: unless-stopped
    init: true
    environment: { <<: *app-env, GAME_NODE_ID: game1 }
    networks: { default: { aliases: [game1] } }
    depends_on:
      api: { condition: service_healthy }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, retries: 6, start_period: 10s }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  game2:
    profiles: [scale]
    image: vanta-frontline/server:${VANTA_VERSION:-local}
    command: ["node", "dist/game-main.js"]
    restart: unless-stopped
    init: true
    environment: { <<: *app-env, GAME_NODE_ID: game2 }
    # "game" é o nome que o nginx usa para distribuir conexões novas entre os nós.
    networks: { default: { aliases: [game, game2] } }
    depends_on:
      game: { condition: service_healthy }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, retries: 6, start_period: 10s }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build: { context: ., target: web }
    image: vanta-frontline/web:${VANTA_VERSION:-local}
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
      game: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"], interval: 10s, retries: 6 }

  mailpit:
    profiles: [local]
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

volumes:
  pgdata:
  redisdata:
