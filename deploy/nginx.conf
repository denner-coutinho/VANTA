# Cliente estático + proxy para a API (/api) e para o servidor de jogo (/game, WebSocket).
# O TLS fica num balanceador ou proxy na frente (Caddy, Cloudflare, ALB); veja docs/DEPLOY.md.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream vanta_api  { server api:4000;  keepalive 32; }

# Servidores de jogo: conexão nova vai para "game" (o DNS do Docker distribui entre os nós);
# /game?node=gameN vai direto para aquele nó (o servidor manda o cliente para lá quando a partida,
# o grupo ou a sala dele está naquele nó). Só aceita nomes gameN: nada de encaminhar para outro host.
resolver 127.0.0.11 valid=10s ipv6=off;
map $arg_node $vanta_game_host { default game; "~^game[0-9]{1,2}$" $arg_node; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 64k;

  # Cabeçalhos de segurança: ficam nos blocos do cliente (/ e /assets). /api usa os da própria API
  # (helmet); repetir aqui duplicaria cabeçalhos com valores diferentes.

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Métricas ficam só na rede interna (o Prometheus fala direto com api:4000 e game:4100).
  location = /api/metrics { return 404; }

  location /api/ {
    proxy_pass http://vanta_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location = /game {
    proxy_pass http://$vanta_game_host:4100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Arquivos com hash no nome: cache longo. index.html: sempre revalidar.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }
}
